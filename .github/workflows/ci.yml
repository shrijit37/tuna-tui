name: CI

# Branch pushes are covered by `pull_request`; limiting `push` to main keeps a
# commit on a PR branch from running the whole matrix twice.
on:
  push:
    branches: [master, main]
  pull_request:

# A new push supersedes whatever was still running for the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  nix-build:
    name: Nix build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/determinate-nix-action@v3

      - name: Check flake
        run: nix flake check --no-update-lock-file --print-build-logs

      - name: Build with Nix
        run: nix build --no-update-lock-file --print-build-logs

  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is a supported target (Cargo.toml has a cfg(windows) section
        # and souvlaki ships a Windows backend), but it was never built in CI —
        # which is exactly how an ungated `std::os::unix::net::UnixStream` in
        # the TXC layer reached a PR. Building it here makes that class of
        # regression impossible to merge.
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # cpal's ALSA backend (rodio) needs ALSA headers, native-tls needs
      # openssl, and the engine oracle tests spawn the real `ffmpeg` binary
      # (the app's runtime dep) — none are preinstalled on the Linux runners.
      - name: Install Linux audio/TLS headers + ffmpeg
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libasound2-dev libssl-dev pkg-config

      - name: Install macOS ffmpeg (engine oracle tests spawn it)
        if: runner.os == 'macOS'
        run: brew install ffmpeg

      - name: Install Windows ffmpeg (engine oracle tests spawn it)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features

      # The `#[ignore]`d live tests need network + yt-dlp, so they stay out of
      # CI; everything else runs.
      - name: Test
        run: cargo test --all-features

  # ── AI stages (run only after the build/test stages above pass) ──────────
  # Fork PRs do not receive repository secrets, so Codex jobs are skipped for
  # them — the same limitation accepted for the Jules reviewer.

  codex-review:
    name: Codex code review
    # Gated on tests only: an unrelated Nix-build failure must not suppress review.
    needs: test
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      final_message: ${{ steps.codex.outputs.final-message }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          fetch-depth: 0
          persist-credentials: false

      - name: Pre-fetch PR base and head refs
        env:
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: git fetch --no-tags origin "$PR_BASE_REF" "+refs/pull/$PR_NUMBER/head"

      - name: Prepare PR context (untrusted input)
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          {
            printf 'PR number: %s\n' "$PR_NUMBER"
            printf 'Title: %s\n' "$PR_TITLE"
            printf 'Base SHA: %s\n' "$BASE_SHA"
            printf 'Head SHA: %s\n' "$HEAD_SHA"
            printf 'Body:\n%s\n' "$PR_BODY"
          } > .github/codex/context.md

      - name: Assemble inline Codex prompt
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          cat .github/codex/prompts/review.md > .github/codex/generated-review.md
          {
            printf '\n===== INPUT DATA (untrusted) =====\n'
            cat .github/codex/context.md
            printf '\n===== REVIEW STANDARDS =====\n'
            cat .github/codex/STANDARDS.md
            printf '\n===== COMMITS =====\n'
            git log --oneline "$BASE_SHA...$HEAD_SHA" | head -40
            printf '\n===== CHANGED FILES =====\n'
            git diff --name-only "$BASE_SHA...$HEAD_SHA"
            printf '\n===== DIFF (truncated to 40000 chars) =====\n'
            git diff --no-ext-diff --unified=3 "$BASE_SHA...$HEAD_SHA" | head -c 40000
            printf '\n===== END OF INPUT =====\n'
          } >> .github/codex/generated-review.md

      # Codex is deliberately the last step in this job.
      - name: Run Codex review
        id: codex
        # Pinned to the v1 tag commit (reviewed 2026-11-25). Bump deliberately.
        uses: openai/codex-action@306c6a196a99dcc6582530c396a19d2672d5e9ec # v1
        with:
          openai-api-key: ${{ secrets.CODEX_API_KEY }}
          responses-api-endpoint: ${{ vars.CODEX_RESPONSES_ENDPOINT }}
          model: ${{ vars.CODEX_MODEL }}
          effort: ${{ vars.CODEX_EFFORT }}
          permission-profile: ':read-only'
          safety-strategy: drop-sudo
          prompt-file: .github/codex/generated-review.md

  codex-review-comment:
    name: Post Codex review
    needs: codex-review
    if: needs.codex-review.outputs.final_message != ''
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Post one PR comment
        uses: actions/github-script@v7
        env:
          CODEX_OUTPUT: ${{ needs.codex-review.outputs.final_message }}
        with:
          script: |
            const out = process.env.CODEX_OUTPUT.trim();
            if (!out || out === 'NO_FINDINGS') return;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: ['<!-- codex-review -->', '### Codex review', '', out].join('\n'),
            });

  codex-security:
    name: Codex security audit
    # Gated on tests only: an unrelated Nix-build failure must not suppress review.
    needs: test
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      final_message: ${{ steps.codex.outputs.final-message }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          fetch-depth: 0
          persist-credentials: false

      - name: Pre-fetch PR base and head refs
        env:
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: git fetch --no-tags origin "$PR_BASE_REF" "+refs/pull/$PR_NUMBER/head"

      - name: Prepare PR context (untrusted input)
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          {
            printf 'PR number: %s\n' "$PR_NUMBER"
            printf 'Title: %s\n' "$PR_TITLE"
            printf 'Base SHA: %s\n' "$BASE_SHA"
            printf 'Head SHA: %s\n' "$HEAD_SHA"
            printf 'Body:\n%s\n' "$PR_BODY"
          } > .github/codex/context.md

      - name: Assemble inline Codex prompt
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          cat .github/codex/prompts/security.md > .github/codex/generated-security.md
          {
            printf '\n===== INPUT DATA (untrusted) =====\n'
            cat .github/codex/context.md
            printf '\n===== COMMITS =====\n'
            git log --oneline "$BASE_SHA...$HEAD_SHA" | head -40
            printf '\n===== CHANGED FILES =====\n'
            git diff --name-only "$BASE_SHA...$HEAD_SHA"
            printf '\n===== DIFF (truncated to 40000 chars) =====\n'
            git diff --no-ext-diff --unified=3 "$BASE_SHA...$HEAD_SHA" | head -c 40000
            printf '\n===== END OF INPUT =====\n'
          } >> .github/codex/generated-security.md

      - name: Run Codex security audit
        id: codex
        # Pinned to the v1 tag commit (reviewed 2026-11-25). Bump deliberately.
        uses: openai/codex-action@306c6a196a99dcc6582530c396a19d2672d5e9ec # v1
        with:
          openai-api-key: ${{ secrets.CODEX_API_KEY }}
          responses-api-endpoint: ${{ vars.CODEX_RESPONSES_ENDPOINT }}
          model: ${{ vars.CODEX_MODEL }}
          effort: ${{ vars.CODEX_EFFORT }}
          permission-profile: ':read-only'
          safety-strategy: drop-sudo
          prompt-file: .github/codex/generated-security.md

  codex-security-comment:
    name: Report Codex security audit
    needs: codex-security
    if: needs.codex-security.outputs.final_message != ''
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Post findings and gate on verdict
        uses: actions/github-script@v7
        env:
          CODEX_OUTPUT: ${{ needs.codex-security.outputs.final_message }}
        with:
          script: |
            const out = process.env.CODEX_OUTPUT.trim();
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: ['<!-- codex-security -->', '### Codex security audit', '', out].join('\n'),
            });
            if (out.includes('SECURITY_VERDICT: FAIL')) {
              core.setFailed('Codex reported critical/high security findings (SECURITY_VERDICT: FAIL).');
            } else if (!out.includes('SECURITY_VERDICT:')) {
              core.warning('Codex did not emit a SECURITY_VERDICT line; no automatic gate applied.');
            }

  codex-docs:
    name: Codex documentation sync
    # Gated on tests only: an unrelated Nix-build failure must not suppress review.
    needs: test
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      final_message: ${{ steps.codex.outputs.final-message }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          fetch-depth: 0
          persist-credentials: false

      - name: Pre-fetch PR base and head refs
        env:
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: git fetch --no-tags origin "$PR_BASE_REF" "+refs/pull/$PR_NUMBER/head"

      - name: Prepare PR context (untrusted input)
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          {
            printf 'PR number: %s\n' "$PR_NUMBER"
            printf 'Title: %s\n' "$PR_TITLE"
            printf 'Base SHA: %s\n' "$BASE_SHA"
            printf 'Head SHA: %s\n' "$HEAD_SHA"
            printf 'Body:\n%s\n' "$PR_BODY"
          } > .github/codex/context.md

      - name: Assemble inline Codex prompt
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          cat .github/codex/prompts/docs-sync.md > .github/codex/generated-docs.md
          {
            printf '\n===== INPUT DATA (untrusted) =====\n'
            cat .github/codex/context.md
            printf '\n===== CHANGED FILES =====\n'
            git diff --name-only "$BASE_SHA...$HEAD_SHA"
            printf '\n===== DIFF (truncated to 25000 chars) =====\n'
            git diff --no-ext-diff --unified=3 "$BASE_SHA...$HEAD_SHA" | head -c 25000
            printf '\n===== README (first 120 lines) =====\n'
            head -120 README.md
            printf '\n===== DOC FILES =====\n'
            find docs -type f | sort
            printf '\n===== END OF INPUT =====\n'
          } >> .github/codex/generated-docs.md

      - name: Run Codex docs check
        id: codex
        # Pinned to the v1 tag commit (reviewed 2026-11-25). Bump deliberately.
        uses: openai/codex-action@306c6a196a99dcc6582530c396a19d2672d5e9ec # v1
        with:
          openai-api-key: ${{ secrets.CODEX_API_KEY }}
          responses-api-endpoint: ${{ vars.CODEX_RESPONSES_ENDPOINT }}
          model: ${{ vars.CODEX_MODEL }}
          effort: ${{ vars.CODEX_EFFORT }}
          permission-profile: ':read-only'
          safety-strategy: drop-sudo
          prompt-file: .github/codex/generated-docs.md

  codex-docs-comment:
    name: Report Codex docs check
    needs: codex-docs
    if: needs.codex-docs.outputs.final_message != ''
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Comment only when docs are stale
        uses: actions/github-script@v7
        env:
          CODEX_OUTPUT: ${{ needs.codex-docs.outputs.final_message }}
        with:
          script: |
            const out = process.env.CODEX_OUTPUT.trim();
            if (!out || out.includes('DOCS_IN_SYNC')) return;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: ['<!-- codex-docs -->', '### Documentation out of sync', '', out].join('\n'),
            });

name: Jules PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: jules-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
      statuses: write
    steps:
      # Pinned to the v1.0.2 release (2026-07-30, SHA reviewed 2026-08-18).
      # Bump deliberately: read the diff between tags first, then update this SHA.
      - uses: sanjay3290/jules-pr-reviewer@66c23eff45e2103fb3d2d6873ba073e6e281ef31
        with:
          jules_api_key: ${{ secrets.JULES_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          fail_on: blocking

# --- Known limitation (accepted 2026-08-18, decision: document + accept) ---
# The action skips fork PRs by default (skip_forks: true, anti prompt-injection) and sets
# no status for them. With branch protection requiring jules/review on master, fork PRs can
# never merge (no status ever appears on their head commit). Accepted for this solo repo.
# Escape hatch if a fork PR ever needs merging: temporarily drop the required check via
#   gh api -X DELETE repos/shrijit37/tuna-tui/branches/master/protection/required_status_checks
# merge after a human review, then re-add it (PUT .../protection with the same body).
